<style>

  .card { background: rgba(14,16,25,.95); border: 3px solid var(--line); box-shadow: 6px 6px 0 #000; padding: clamp(18px, 4vw, 34px);
    width: 100%; max-width: 560px; text-align: center; }
  h1 { font: clamp(18px, 4.4vw, 32px)/1.4 var(--pixel); margin: 0 0 14px; text-shadow: 3px 3px 0 #000; }
  h1 .a { color: var(--mo); } h1 .b { color: var(--co); }
  .lock { font: 28px/1 var(--pixel); margin: 0 0 12px; }
  p { margin: 0 0 18px; color: #d9d3c4; }
  form { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  input { font: clamp(18px, 4vw, 24px)/1 var(--pixel); text-align: center; letter-spacing: 3px; text-transform: uppercase;
    width: 100%; max-width: 340px; padding: 16px 10px 14px; background: #05060a; color: var(--cream); border: 3px solid var(--line); border-radius: 0; }
  input:focus { outline: none; border-color: var(--co); }
  button { font: 14px/1.4 var(--pixel); background: var(--cream); color: var(--bg); border: 0; padding: 18px 26px 16px; min-height: 56px;
    box-shadow: 5px 5px 0 #000; cursor: pointer; }
  button:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #000; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 1.6em; margin: 4px 0 0; font: 10px/1.7 var(--pixel); color: var(--mut); }
  #msg.no { color: var(--red); }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  a { color: var(--mut); font-size: 14px; }
</style>

const STORE = 'unlock:' + LOCK.id;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

async function tryCode(raw) {
  const pass = new TextEncoder().encode(norm(raw));
  const base = await crypto.subtle.importKey('raw', pass, 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(LOCK.salt), iterations: LOCK.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(LOCK.iv) }, key, b64(LOCK.ct));   // throws if the code is wrong
  return new TextDecoder().decode(plain);
}
function openGame(html, code) {
  try { localStorage.setItem(STORE, norm(code)); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const $ = id => document.getElementById(id), msg = $('msg');
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('code').value;
  if (!norm(code)) { $('code').focus(); return; }
  $('go').disabled = true; msg.className = ''; msg.textContent = 'CHECKING…';
  try { openGame(await tryCode(code), code); }
  catch (err) {
    msg.className = 'no'; msg.textContent = 'NOT YET. CHECK THE CODE AND TRY AGAIN.';
    $('code').classList.remove('shake'); void $('code').offsetWidth; $('code').classList.add('shake');
    $('go').disabled = false; $('code').select();
  }
});
if (!window.crypto || !crypto.subtle) { msg.className = 'no'; msg.textContent = 'THIS BROWSER CANNOT UNLOCK THE GAME. TRY CHROME, EDGE OR SAFARI.'; }
// a device that already unlocked with the current code opens straight away
(async () => {
  let saved = null; try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved && window.crypto && crypto.subtle) { msg.textContent = 'OPENING…'; try { openGame(await tryCode(saved), saved); return; } catch (e) { try { localStorage.removeItem(STORE); } catch (_) {} msg.textContent = ''; } }
  $('code').focus();
})();
})();
</script>
