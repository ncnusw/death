<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Swing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07080d; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; position: absolute; }

  /* ---- touch controls (shown on tablets and phones) ---- */
  #touch { display: none; position: absolute; inset: 0; pointer-events: none; }
  #touch.on { display: block; }
  .tgroup { position: absolute; display: flex; gap: 10px; pointer-events: none; }
  .tbtn { pointer-events: auto; flex: 1 1 0; min-width: 0; min-height: 0; border: 3px solid; border-radius: 6px;
    background: #10121c; color: #f1ecdf; font: 12px "Press Start 2P", monospace; line-height: 1.5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 4px; box-shadow: 0 5px 0 #000; touch-action: none; cursor: pointer; text-align: center; }
  .tbtn small { font-size: 7px; opacity: .85; letter-spacing: .5px; }
  .tbtn.lo { border-color: #6fa8ff; color: #6fa8ff; }
  .tbtn.ro { border-color: #ffc857; color: #ffc857; }
  .tbtn.col { border-color: #f1ecdf; color: #f1ecdf; }
  .tbtn.pause { flex: 0 0 auto; min-width: 56px; min-height: 44px;border-color: #8a8578; color: #8a8578; font-size: 10px; }
  .tbtn.spacer { visibility: hidden; }
  .tbtn.down { transform: translateY(4px); box-shadow: 0 1px 0 #000; filter: brightness(1.5); }

  /* ---- rotate hint (phones held upright) ---- */
  #rotate { display: none; position: absolute; inset: 0; background: #07080d; color: #f1ecdf; z-index: 5;
    font: 12px/2 "Press Start 2P", monospace; text-align: center; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  #rotate.on { display: flex; }
  #rotate .phone { width: 44px; height: 76px; border: 4px solid #6fa8ff; border-radius: 6px; margin-bottom: 28px;
    animation: turn 2.4s ease-in-out infinite; box-shadow: 6px 6px 0 #1f3a6b; }
  #rotate p { margin: 0; max-width: 300px; }
  #rotate .sub { color: #8a8578; font-size: 9px; margin-top: 14px; }
  @keyframes turn { 0%, 30% { transform: rotate(0); border-color: #6fa8ff; } 60%, 100% { transform: rotate(-90deg); border-color: #ffc857; } }
  /* if the page ever gets zoomed in anyway, let a pinch zoom it back out */
  #zoomhint { display: none; position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 6;
    background: #10121c; color: #ffc857; border: 2px solid #ffc857; border-radius: 6px; padding: 8px 12px;
    font: 10px/1.6 "Press Start 2P", monospace; text-align: center; pointer-events: none; }
  html.zoomed #zoomhint { display: block; }
  html.zoomed, html.zoomed * { touch-action: pinch-zoom !important; }
  #inset { position: absolute; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div id="touch" aria-label="Touch controls">
  <div class="tgroup" id="tLeft">
    <button class="tbtn pause" data-k="PAUSE" aria-label="Pause">II</button>
    <button class="tbtn lo" data-k="LP"><span>&#9664; PUSH</span><small id="lblL">LEFT</small></button>
    <button class="tbtn col lo-c" data-k="LC"><span>COLLECT</span><small id="lblLC">AT A SIDE</small></button>
  </div>
  <div class="tgroup" id="tRight">
    <button class="tbtn pause spacer" tabindex="-1" aria-hidden="true">II</button>
    <button class="tbtn ro" data-k="RP"><span>PUSH &#9654;</span><small id="lblR">RIGHT</small></button>
    <button class="tbtn col ro-c" data-k="RC"><span>COLLECT</span><small id="lblRC">AT A SIDE</small></button>
  </div>
</div>
<div id="rotate"><div class="phone"></div><p>Please turn your device sideways to play.</p><p class="sub">The Swing plays in landscape.</p></div>
<div id="inset"></div>
<div id="zoomhint">Pinch with two fingers to zoom back out</div>
<script>
/* =====================================================================
   THE SWING — a cooperative Dual Process Model game (1 or 2 players)
   Controls: 8BitDo Micro (any gamepad), one shared keyboard, or touch.
   Sound effects: ../../assets/audio/wow.mp3 (month cleared),
                  ../../assets/audio/win.mp3 (year complete)
   ===================================================================== */
const AUDIO_DIR = '../../assets/audio/';
const W = 640, H = 360;
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const FONT = '"Press Start 2P", monospace';

/* ---------- layout: canvas + (on touch devices) big on-screen buttons ---------- */
const touchEl = document.getElementById('touch'), rotateEl = document.getElementById('rotate');
const tLeft = document.getElementById('tLeft'), tRight = document.getElementById('tRight');
let touchMode = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
let portrait = false;
function insets() {
  const cs = getComputedStyle(document.getElementById('inset'));
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
           b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function place(el, x, y, w, h) { Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); }
function fit() {
  const iw = innerWidth, ih = innerHeight, ins = insets();
  portrait = touchMode && ih > iw;
  rotateEl.classList.toggle('on', portrait);
  touchEl.classList.toggle('on', touchMode && !portrait);
  const ax = ins.l, ay = ins.t, aw = iw - ins.l - ins.r, ah = ih - ins.t - ins.b;
  if (!touchMode || portrait) {
    const s = Math.min(aw / W, ah / H), cw = Math.floor(W * s), ch = Math.floor(H * s);
    place(cv, ax + (aw - cw) / 2, ay + (ah - ch) / 2, cw, ch);
    return;
  }
  /* two layouts; pick whichever leaves the game bigger:
     SIDE  = button columns left and right of the game (phones)
     BELOW = a button bar under the game (tablets)                 */
  const colW = Math.max(96, Math.min(170, aw * 0.15)), barH = Math.max(110, Math.min(170, ah * 0.2));
  const sSide = Math.min((aw - 2 * colW - 12) / W, ah / H);
  const sBelow = Math.min(aw / W, (ah - barH - 10) / H);
  const pad = 8;
  if (sSide >= sBelow) {
    const s = sSide, cw = Math.floor(W * s), ch = Math.floor(H * s);
    const cx = ax + (aw - cw) / 2, cy = ay + (ah - ch) / 2;
    place(cv, cx, cy, cw, ch);
    const gw = cx - ax - 2 * pad;
    [tLeft, tRight].forEach(el => el.style.flexDirection = 'column');
    place(tLeft, ax + pad, ay + pad, gw, ah - 2 * pad);
    place(tRight, cx + cw + pad, ay + pad, gw, ah - 2 * pad);
  } else {
    const s = sBelow, cw = Math.floor(W * s), ch = Math.floor(H * s);
    const cx = ax + (aw - cw) / 2, cy = ay;
    place(cv, cx, cy, cw, ch);
    const by = cy + ch + pad, bh = ah - ch - 2 * pad, gw = aw / 2 - 1.5 * pad;
    tLeft.style.flexDirection = 'row'; tRight.style.flexDirection = 'row-reverse';
    place(tLeft, ax + pad, by, gw, bh);
    place(tRight, ax + aw / 2 + pad / 2, by, gw, bh);
  }
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 150)); fit();

/* ---------- colours ---------- */
const C = {
  lo: '#6fa8ff', loDark: '#1f3a6b', ro: '#ffc857', roDark: '#6b4a12',
  red: '#ff5d5d', cream: '#f1ecdf', mut: '#8a8578', ink: '#07080d', rope: '#c9bfa8'
};

/* ---------- audio ---------- */
const sfxWow = new Audio(AUDIO_DIR + 'wow.mp3');
const sfxWin = new Audio(AUDIO_DIR + 'win.mp3');
[sfxWow, sfxWin].forEach(a => { a.preload = 'auto'; });
function play(a) { try { a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} }

let actx = null, master, loBus, roBus, bassBus;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    loBus = actx.createGain(); loBus.gain.value = 0; loBus.connect(master);
    roBus = actx.createGain(); roBus.gain.value = 0; roBus.connect(master);
    bassBus = actx.createGain(); bassBus.gain.value = 0; bassBus.connect(master);
  } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.12, bus = null, when = 0) {
  if (!actx) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), v = actx.createGain();
  o.type = type; o.frequency.value = freq;
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v); v.connect(bus || master); o.start(t); o.stop(t + dur + 0.02);
}
const blipLO = () => { tone(523, 0.08, 'square', 0.10); tone(659, 0.10, 'square', 0.08, null, 0.06); };
const blipRO = () => { tone(784, 0.08, 'triangle', 0.14); tone(988, 0.10, 'triangle', 0.12, null, 0.06); };
const thud = () => { tone(110, 0.35, 'sawtooth', 0.12); tone(82, 0.45, 'square', 0.08, null, 0.1); };
const tick = () => tone(1200, 0.03, 'square', 0.04);

/* chiptune: shared bass + a Loss-Oriented layer (low, minor colour) + a Restoration-Oriented layer (high, bright).
   The song only sounds whole when the swing keeps moving between both sides. */
const CH = [ // Am  F  C  G
  { bass: 110.0, lo: [220.0, 261.6, 329.6], ro: [880.0, 1046.5, 1318.5] },
  { bass: 87.31, lo: [174.6, 220.0, 261.6], ro: [698.5, 880.0, 1046.5] },
  { bass: 130.8, lo: [196.0, 261.6, 311.1], ro: [1046.5, 1318.5, 1568.0] },
  { bass: 98.00, lo: [196.0, 246.9, 293.7], ro: [784.0, 987.8, 1174.7] }
];
let musicOn = false, nextNote = 0, step = 0;
const STEP = 60 / 132 / 2;
function scheduleMusic() {
  if (!actx || !musicOn) return;
  while (nextNote < actx.currentTime + 0.15) {
    const bar = Math.floor(step / 8) % 4, s = step % 8, ch = CH[bar];
    const when = nextNote - actx.currentTime;
    if (s % 4 === 0) tone(ch.bass, STEP * 3.6, 'triangle', 0.5, bassBus, when);
    tone(ch.lo[[0, 1, 2, 1, 0, 2, 1, 2][s]], STEP * 0.9, 'square', 0.25, loBus, when);
    if (s % 2 === 0) tone(ch.ro[[0, 2, 1, 2][s / 2]], STEP * 1.7, 'triangle', 0.35, roBus, when);
    nextNote += STEP; step++;
  }
}
function setBus(bus, v) { if (bus) bus.gain.setTargetAtTime(v, actx.currentTime, 0.25); }
function startMusic() { if (!actx) return; musicOn = true; nextNote = actx.currentTime + 0.05; }
function stopMusic() { musicOn = false; if (actx) { setBus(loBus, 0); setBus(roBus, 0); setBus(bassBus, 0); } }

/* ---------- months ---------- */
const MONTHS = [
  { name: 'The first weeks', note: 'Everything is new. Find your rhythm.', fx: {} },
  { name: 'The casseroles stop coming', note: 'Life tasks pile up faster.', fx: { roDrain: 1.35 } },
  { name: 'Their birthday', note: 'GRIEF SURGE: Loss-Oriented pull is stronger.', fx: { loPull: 1.6, loDrain: 1.5, rain: 1 } },
  { name: 'First tax season alone', note: 'LIFE SHOCK: Restoration-Oriented needs drain fast.', fx: { roDrain: 1.8, roSpawn: 0.6 } },
  { name: 'Back to full-time work', note: 'Busyness pulls you toward Restoration-Oriented coping.', fx: { roPull: 1.6 } },
  { name: 'New Year dinner, one empty seat', note: 'GRIEF SURGE: Loss-Oriented pull is stronger.', fx: { loPull: 1.7, loDrain: 1.6, rain: 1 } },
  { name: 'A quiet month', note: 'Calm... but the wind picks up.', fx: { gust: 1 } },
  { name: 'A child gets sick', note: 'LIFE SHOCK: Restoration-Oriented needs drain fast.', fx: { roDrain: 1.9, roSpawn: 0.6 } },
  { name: 'Their favourite song on the radio', note: 'Sudden grief waves, without warning.', fx: { spikes: 1 } },
  { name: 'Moving their things', note: 'Both kinds of needs drain faster.', fx: { loDrain: 1.35, roDrain: 1.35 } },
  { name: 'A special anniversary', note: 'GRIEF SURGE, and the swings are softening.', fx: { loPull: 1.6, loDrain: 1.5, rain: 1 } },
  { name: 'One year since', note: 'Hold a gentle, steady swing between both sides.', fx: { loPull: 1.3, loDrain: 1.3, rain: 1 } }
];
const MONTH_SECONDS = 20;
const DIFF = {
  Easy:   { drain: 0.7,  pull: 0.75, hearts: 5, hints: true,  gust: false },
  Normal: { drain: 1.0,  pull: 1.0,  hearts: 4, hints: true,  gust: false },
  Hard:   { drain: 1.25, pull: 1.2,  hearts: 3, hints: false, gust: true }
};
const DIFF_NAMES = ['Easy', 'Normal', 'Hard'];

/* ---------- state ---------- */
let scene = 'title';           // title, join2, diff, card, play, setback, end
let players = [];              // { kind:'pad', index } or { kind:'keys' }
let solo = true, diffIdx = 1, D = DIFF.Normal;
let visible = true, paused = false;
let S = null;                  // game state
let sceneT = 0;
let particles = [];

function newGame() {
  S = {
    month: 0, mt: 0, hearts: D.hearts,
    th: 0.55, w: 0,
    loNeed: 75, roNeed: 75, ex: 0,
    linger: 0, lingerSide: 0,
    pumped: { '-1': false, '1': false }, lastStuck: { '-1': -9, '1': -9 }, prevSign: 1,
    tokens: { '-1': [], '1': [] }, spawnT: { '-1': 0, '1': 0 },
    lastVisit: { '-1': -9, '1': -9 }, time: 0,
    stats: { lo: 0, ro: 0, mid: 0, setbacks: 0, swings: 0, collected: 0, monthsLost: 0 },
    msg: '', msgT: 0, flash: { '-1': 0, '1': 0 }, flashTxt: { '-1': '', '1': '' },
    gustT: 3, gustA: 0, spikeT: 4, spike: 0, setbackWhy: ''
  };
}

/* ---------- geometry ---------- */
const PX = 320, PY = 34, L = 196;
const zoneZ = () => 0.86 - (0.50 * S.month / 11);   // swings soften over the year
const posAt = (a, r = L) => [PX + r * Math.sin(a), PY + r * Math.cos(a)];
const fxv = (k, d = 1) => (MONTHS[S.month].fx[k] || d);

/* ---------- input ---------- */
const keys = {}, keyHit = new Set();
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); if (!e.repeat) keyHit.add(k);
  keys[k] = true; initAudio();
  if ([' ', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const kp = k => keyHit.has(k);

/* touch: on-screen buttons (LP/LC = left push/collect, RP/RC = right, PAUSE) and taps on the game */
const tHit = new Set();
let tap = null;                                    // {x, y} in game pixels, for this frame
const tp = k => tHit.has(k);
addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'touch' || e.pointerType === 'pen') {
    if (!touchMode) { touchMode = true; fit(); }
  }
});
touchEl.querySelectorAll('.tbtn[data-k]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); tHit.add(b.dataset.k); b.classList.add('down'); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('down')));
});
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  tap = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
});
addEventListener('contextmenu', e => { if (touchMode) e.preventDefault(); });
/* stop the browser from zooming when buttons are tapped quickly (double-tap zoom) or pinched */
const isZoomed = () => !!(window.visualViewport && visualViewport.scale > 1.02);
document.addEventListener('touchstart', e => { if (!isZoomed() && e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', e => { if (!isZoomed()) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
const zoomHint = document.getElementById('zoomhint');
function checkZoom() {
  const z = isZoomed(); document.documentElement.classList.toggle('zoomed', z);
  if (z) { const v = visualViewport;   /* keep the hint in the part of the page you can see */
    Object.assign(zoomHint.style, { left: (v.offsetLeft + v.width / 2) + 'px', top: (v.offsetTop + 8 / v.scale) + 'px',
      transform: 'translateX(-50%) scale(' + (1 / v.scale) + ')', transformOrigin: 'top center' }); }
}
if (window.visualViewport) { visualViewport.addEventListener('resize', checkZoom); visualViewport.addEventListener('scroll', checkZoom); }
const inBox = (p, x, y, w, h) => p && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;

const padPrev = {};
function readPad(i) {
  const gp = (navigator.getGamepads ? navigator.getGamepads() : [])[i];
  if (!gp) return null;
  const b = j => gp.buttons[j] ? (gp.buttons[j].pressed || gp.buttons[j].value > 0.5) : false;
  const ax = gp.axes[0] || 0;
  return {
    face: b(0) || b(1) || b(2) || b(3),
    left: b(14) || b(4) || b(6) || ax < -0.6,
    right: b(15) || b(5) || b(7) || ax > 0.6,
    any4: b(12) || b(13),
    start: b(9), select: b(8),
    any: gp.buttons.some(x => x && x.pressed) || Math.abs(ax) > 0.6
  };
}
function padEdges(i) {
  const now = readPad(i); if (!now) return null;
  const prev = padPrev[i] || {};
  const e = {}; for (const k in now) e[k] = now[k] && !prev[k];
  e.pump = e.left || e.right || e.any4;
  padPrev[i] = now;
  return e;
}
function allPads() { return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean).map(p => p.index) : []; }

/* one input frame: returns per-player edge actions
   KEYBOARD LAYOUT (one shared keyboard)
     Player 1 (Loss-Oriented):        A = push    S = collect
     Player 2 (Restoration-Oriented): → = push    ↓ = collect
     Solo:  A/← push left   D/→ push right   S/↓/Space collect
     Esc or P = pause, Backspace = quit (while paused)
   TOUCH: left column = Player 1 / push left, right column = Player 2 / push right,
          COLLECT under each, II = pause. Tap the game to continue on cards.   */
const K1_PUSH = ['a'], K1_COL = ['s'];
const K2_PUSH = ['arrowright'], K2_COL = ['arrowdown'];
const anyKey = list => list.some(k => kp(k));
function gatherInput() {
  const out = { any: false, start: false, select: false, left: false, right: false, confirm: false, pads: {} };
  for (const i of allPads()) {
    const e = padEdges(i); if (!e) continue;
    out.pads[i] = e;
    if (e.any) out.any = true;
    if (e.start) out.start = true;
    if (e.select) out.select = true;
    if (e.left) out.left = true;
    if (e.right) out.right = true;
    if (e.face) out.confirm = true;
  }
  if (anyKey(['enter', ' ', 's', 'arrowdown'])) out.confirm = true;
  if (keyHit.size) out.any = true;
  if (anyKey(['a', 'arrowleft'])) out.left = true;
  if (anyKey(['d', 'arrowright'])) out.right = true;
  if (anyKey(['escape', 'p'])) out.start = true;
  if (anyKey(['backspace', 'q'])) out.select = true;
  /* touch */
  if (tHit.size || tap) out.any = true;
  if (tp('LP')) out.left = true;
  if (tp('RP')) out.right = true;
  if (tp('LC') || tp('RC')) out.confirm = true;
  out.confirmBtn = out.confirm;          // confirm without a tap on the game
  if (tap) out.confirm = true;
  if (tp('PAUSE')) out.start = true;
  out.tap = tap;
  return out;
}

/* actions during play: pumps and collects for each side */
function playActions(inp) {
  const act = { pump: { '-1': false, '1': false }, collect: { '-1': false, '1': false }, collectAny: false };
  if (solo) {
    const p = players[0];
    if (p && p.kind === 'pad') {
      const e = inp.pads[p.index] || {};
      if (e.left) act.pump['-1'] = true;
      if (e.right) act.pump['1'] = true;
      if (e.face) act.collectAny = true;
    }
    if (anyKey(['a', 'arrowleft'])) act.pump['-1'] = true;
    if (anyKey(['d', 'arrowright'])) act.pump['1'] = true;
    if (anyKey(['s', 'arrowdown', ' '])) act.collectAny = true;
    if (tp('LP')) act.pump['-1'] = true;
    if (tp('RP')) act.pump['1'] = true;
    if (tp('LC') || tp('RC')) act.collectAny = true;
  } else {
    if (tp('LP')) act.pump['-1'] = true;
    if (tp('LC')) act.collect['-1'] = true;
    if (tp('RP')) act.pump['1'] = true;
    if (tp('RC')) act.collect['1'] = true;
    [[players[0], '-1'], [players[1], '1']].forEach(([p, side]) => {
      if (p && p.kind === 'pad') {
        const e = inp.pads[p.index] || {};
        if (e.pump) act.pump[side] = true;
        if (e.face) act.collect[side] = true;
      }
    });
    if (anyKey(K1_PUSH)) act.pump['-1'] = true;
    if (anyKey(K1_COL)) act.collect['-1'] = true;
    if (anyKey(K2_PUSH)) act.pump['1'] = true;
    if (anyKey(K2_COL)) act.collect['1'] = true;
  }
  return act;
}

/* ---------- slide visibility (sent by the Quarto deck) ---------- */
addEventListener('message', ev => {
  if (ev.data && ev.data.type === 'slideVisibility') {
    visible = !!ev.data.visible;
    if (!visible) { stopMusic(); if (scene === 'play') paused = true; }   // players resume deliberately
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopMusic(); if (scene === 'play') paused = true; }
});

/* ---------- game logic ---------- */
function pump(side) {
  side = +side;
  const moving = Math.sign(S.w) === side && Math.abs(S.w) > 0.12;
  if (moving) {
    if (!S.pumped[side]) {
      S.w += side * 0.62 * Math.max(0.35, Math.cos(S.th));
      S.pumped[side] = true; flash(side, 'PUSH!'); tick();
    } else flash(side, 'WAIT');
  } else if (Math.abs(S.w) <= 0.12 || Math.sign(S.th) === -side) {
    if (S.time - S.lastStuck[side] > 0.28) {           // breaking free from the other side's pull
      S.w += side * 0.55; S.lastStuck[side] = S.time; flash(side, 'PULL!'); tick();
    }
  } else {
    S.w *= 0.82; flash(side, 'OFF-BEAT');               // pushing against the swing slows it
  }
}
function flash(side, t) { S.flash[side] = 0.6; S.flashTxt[side] = t; }

function collect(side) {
  side = +side;
  const inZone = Math.sign(S.th) === side && Math.abs(S.th) > zoneZ();
  const list = S.tokens[side];
  if (!inZone || !list.length) { flash(side, inZone ? 'EMPTY' : 'TOO FAR'); return; }
  const tk = list.shift();
  if (side < 0) { S.loNeed = Math.min(100, S.loNeed + 11); blipLO(); }
  else { S.roNeed = Math.min(100, S.roNeed + 11); blipRO(); }
  S.stats.collected++;
  const [x, y] = posAt(tk.a, L + 22);
  for (let i = 0; i < 10; i++) particles.push({ x, y, vx: (Math.random() - .5) * 90, vy: (Math.random() - .8) * 90, t: 0.7, c: side < 0 ? C.lo : C.ro });
}

function setback(why) {
  S.hearts--; S.stats.setbacks++; S.setbackWhy = why; thud();
  S.loNeed = Math.max(S.loNeed, 55); S.roNeed = Math.max(S.roNeed, 55); S.ex = 25;
  S.th = 0.4 * Math.sign(S.th || 1) * -1; S.w = 0; S.linger = 0;
  S.tokens['-1'] = []; S.tokens['1'] = [];
  scene = 'setback'; sceneT = 0; stopMusic();
}

function update(dt, inp) {
  S.time += dt; S.mt += dt;
  const Z = zoneZ();

  /* actions */
  const act = playActions(inp);
  for (const s of ['-1', '1']) if (act.pump[s]) pump(s);
  if (solo) { if (act.collectAny) collect(Math.sign(S.th) || 1); }
  else for (const s of ['-1', '1']) if (act.collect[s]) collect(s);

  /* physics */
  const side = Math.sign(S.th);
  const inZone = Math.abs(S.th) > Z;
  if (inZone) { if (S.lingerSide !== side) { S.linger = 0; S.lingerSide = side; } S.linger += dt; S.lastVisit[side] = S.time; }
  else S.linger = 0;
  let pull = 0;
  if (inZone && S.linger > 0.35) {
    const mult = side < 0 ? fxv('loPull') : fxv('roPull');
    pull = side * mult * D.pull * Math.min(7.5, (S.linger - 0.35) * 5.4);
  }
  if (D.gust || fxv('gust', 0)) {
    S.gustT -= dt;
    if (S.gustT <= 0) { S.gustA = (Math.random() < .5 ? -1 : 1) * (1.6 + Math.random() * 1.6); S.gustT = 2.5 + Math.random() * 3; }
    S.gustA *= Math.pow(0.2, dt);
  } else S.gustA = 0;
  if (fxv('spikes', 0)) {
    S.spikeT -= dt;
    if (S.spikeT <= 0) { S.spike = 1.2; S.spikeT = 3 + Math.random() * 3; S.msg = 'A grief wave!'; S.msgT = 1.2; }
  }
  if (S.spike > 0) { S.spike -= dt; pull += -2.6; }
  const acc = -9 * Math.sin(S.th) - 0.16 * S.w + pull + S.gustA;
  S.w += acc * dt; S.th += S.w * dt;
  if (Math.abs(S.th) > 1.34) { S.th = Math.sign(S.th) * 1.34; S.w *= -0.35; S.ex += 9; flash(Math.sign(S.th), 'TOO HIGH!'); thud(); }
  const sg = Math.sign(S.w);
  if (sg !== 0 && sg !== S.prevSign) {               // a new half-swing begins
    S.pumped[sg] = false; if (sg > 0) S.stats.swings++; S.prevSign = sg;
  }

  /* time spent */
  if (inZone) S.stats[side < 0 ? 'lo' : 'ro'] += dt; else S.stats.mid += dt;

  /* meters */
  const base = 5.2 * D.drain;
  S.loNeed -= base * fxv('loDrain') * dt;
  S.roNeed -= base * fxv('roDrain') * dt;
  if (inZone && S.linger > 0.75) S.ex += 26 * dt;
  else if (!inZone) S.ex -= 9 * dt;
  S.ex = Math.max(0, S.ex);

  /* tokens */
  for (const s of ['-1', '1']) {
    S.spawnT[s] -= dt;
    const rate = (s === '1' ? fxv('roSpawn') : 1) * 1.7;
    if (S.spawnT[s] <= 0 && S.tokens[s].length < 3) {
      const i = S.tokens[s].length;
      S.tokens[s].push({ a: +s * Math.min(1.28, Z + 0.10 + i * 0.13), kind: Math.floor(Math.random() * 3), bob: Math.random() * 6 });
      S.spawnT[s] = rate;
    }
    S.tokens[s].forEach((t, i) => t.a = +s * Math.min(1.28, Z + 0.10 + i * 0.13));
    if (S.flash[s] > 0) S.flash[s] -= dt;
  }
  if (S.msgT > 0) S.msgT -= dt;

  /* failure states teach the model */
  if (S.ex >= 100) return setback(side < 0
    ? ['Flooded by grief.', 'Too long in Loss-Oriented coping', 'without a break.']
    : ['Too busy to grieve.', 'Too long in Restoration-Oriented coping', 'without facing the loss.']);
  if (S.loNeed <= 0) return setback(['Grief pushed away.', 'Loss-Oriented needs went unmet.', '']);
  if (S.roNeed <= 0) return setback(['Life piled up.', 'Restoration-Oriented needs went unmet.', '']);

  /* month complete */
  if (S.mt >= MONTH_SECONDS) {
    S.month++; S.mt = 0;
    if (S.month >= 12) { scene = 'end'; sceneT = 0; stopMusic(); play(sfxWin); return; }
    play(sfxWow); scene = 'card'; sceneT = 0; stopMusic();
  }

  /* music balance */
  if (actx && musicOn) {
    const both = (S.time - S.lastVisit['-1'] < 3.2) && (S.time - S.lastVisit['1'] < 3.2) && S.linger < 0.9;
    setBus(bassBus, 0.10);
    setBus(loBus, both || S.th < 0 ? 0.10 : 0.015);
    setBus(roBus, both || S.th > 0 ? 0.10 : 0.015);
  }
}

function arrowGlyph(cx, cy, dir, sz, col) {
  g.fillStyle = col; g.beginPath();
  const d = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[dir];
  const [dx, dy] = d, px = -dy, py = dx;
  g.moveTo(cx + dx * sz, cy + dy * sz);
  g.lineTo(cx - dx * sz + px * sz, cy - dy * sz + py * sz);
  g.lineTo(cx - dx * sz - px * sz, cy - dy * sz - py * sz);
  g.closePath(); g.fill();
}
function keycap(x, y, label, col, sc = 1) {             // keyboard key
  const arrows = { '←': 'left', '→': 'right', '↓': 'down', '↑': 'up' };
  const w = (label.length > 1 ? label.length * 6 + 8 : 13) * sc, h = 13 * sc;
  rect(x, y + sc, w, h, '#000'); rect(x, y, w, h - sc, '#26262f');
  g.strokeStyle = col; g.lineWidth = sc; g.strokeRect(x + 0.5 * sc, y + 0.5 * sc, w - sc, h - 2 * sc);
  if (arrows[label]) arrowGlyph(x + w / 2, y + h / 2 - sc, arrows[label], 3 * sc, col);
  else txt(label, x + w / 2, y + 3.5 * sc, 6 * sc, col, 'center');
  return w;
}
function dpad(x, y, dir, col, sc = 1) {                 // 8BitDo D-pad
  const u = 4 * sc;
  [[1, 0], [0, 1], [1, 1], [2, 1], [1, 2]].forEach(([i, j]) => rect(x + i * u, y + j * u, u, u, '#4a4a58'));
  const hi = { left: [0, 1], right: [2, 1], up: [1, 0], down: [1, 2] };
  (dir === 'any' ? Object.values(hi) : [hi[dir]]).forEach(([i, j]) => rect(x + i * u, y + j * u, u, u, col));
  return 3 * u;
}
function faceBtns(x, y, col, sc = 1) {                  // A B X Y diamond: any of them works
  const r = 2 * sc, u = 4 * sc;
  [[1, 0], [0, 1], [2, 1], [1, 2]].forEach(([i, j]) => { g.fillStyle = col; g.beginPath(); g.arc(x + i * u + u / 2, y + j * u + u / 2, r, 0, Math.PI * 2); g.fill(); });
  return 3 * u;
}
function shoulder(x, y, label, col, sc = 1) {          // L / R shoulder button
  const w = 14 * sc, h = 11 * sc;
  rect(x, y + sc, w, h, col); rect(x + sc, y + 2 * sc, w - 2 * sc, h - 2 * sc, '#1c1c24');
  txt(label, x + w / 2 + 0.5 * sc, y + 3 * sc, 6 * sc, col, 'center');

}
/* draw a row of items; returns end x */
function controlRow(x, y, items, col, sc = 1) {
  for (const it of items) {

    if (it.t !== undefined) { txt(it.t, x, y + 3.5 * sc, (it.size || 6) * sc, it.col || col); g.font = `${(it.size || 6) * sc}px ${FONT}`; w = g.measureText(it.t).width; }

    else if (it.dpad) w = dpad(x, y, it.dpad, col, sc);
    else if (it.face) w = faceBtns(x, y, col, sc);
    else if (it.sh) w = shoulder(x, y, it.sh, col, sc);

}

  txt('WHO IS PLAYING?', W / 2, 24, 12, C.cream, 'center');
  const slot = (x, who, p, col, side, keyLbl) => {
    rect(x, 50, 260, 196, 'rgba(7,8,13,0.86)'); g.strokeStyle = p ? col : '#3a3a48'; g.lineWidth = 2; g.strokeRect(x, 50, 260, 196);
    txt(who, x + 130, 62, 8, col, 'center');
    txt(side, x + 130, 78, 6, col, 'center');
    if (p) {
      txt('JOINED!', x + 130, 120, 12, col, 'center');
      const how = { pad: `8BitDo controller ${p.index + 1}`, keys: 'Keyboard', touch: 'Touch buttons' };
      txt(how[p.kind], x + 130, 146, 8, C.cream, 'center');
    } else {
      if (Math.floor(performance.now() / 500) % 2) txt('TO JOIN:', x + 130, 98, 8, C.cream, 'center');
      txt('press any button on an 8BitDo', x + 130, 116, 6, C.cream, 'center');
      faceBtns(x + 112, 128, col, 3);
      txt('or press this key', x + 130, 172, 6, C.cream, 'center');
      keycap(x + 114, 184, keyLbl, col, 2.5);
      txt('or tap this box', x + 130, 226, 6, touchMode ? col : C.cream, 'center');
    }
  };
  slot(50, 'PLAYER 1', players[0], C.lo, 'LOSS-ORIENTED', 'A');
  slot(330, 'PLAYER 2', players[1], C.ro, 'RESTORATION-ORIENTED', '→');
  if (players[0] && players[1]) txt('READY!', W / 2, 262, 12, C.cream, 'center');
  else if (players[0] || players[1]) {
    rect(SOLO_BOX[0], SOLO_BOX[1], SOLO_BOX[2], SOLO_BOX[3], 'rgba(7,8,13,0.86)');
    g.strokeStyle = '#3a3a48'; g.lineWidth = 2; g.strokeRect(...SOLO_BOX);
    txt('Only one player?  Play solo:', W / 2, 258, 6, C.mut, 'center');
    controlRow(W / 2 - 112, 272, [{ t: 'START' }, OR, { key: 'ENTER' }, OR, { t: 'tap this box' }], C.cream, 1.2);
  }
}
const SOLO_BOX = [130, 250, 380, 46];
const SLOT_BOX = [[50, 50, 260, 196], [330, 50, 260, 196]];

function drawDiff() {
  drawSky(); drawGround();
  txt('HOW TO PLAY', W / 2, 14, 12, C.cream, 'center');
  panel(34, 180);
  if (solo) {
    txt('SOLO: you push both ways and collect at both sides.', W / 2, 46, 6, C.cream, 'center');
  } else {
    txt('P1 pushes only as the swing moves LEFT (LOSS-ORIENTED).', W / 2, 46, 6, C.lo, 'center');
    txt('P2 pushes only as the swing moves RIGHT (RESTORATION-ORIENTED).', W / 2, 60, 6, C.ro, 'center');
  }
  center(['One push per swing. Off-beat pushes slow the swing down.',
          'At the LOSS-ORIENTED side, collect memories (blue).',
          'At the RESTORATION-ORIENTED side, collect life tasks (gold).',
          'Linger too long and the pull gets you STUCK:',
          'the other side must push you free.',
          'Swing too hard into the top and you crash.'], 80, 6, C.cream, 15);
  txt('The year has 12 months. The two sides move closer as the year goes on.', W / 2, 176, 6, C.mut, 'center');
  txt('Keep your swings smaller and steadier near the end.', W / 2, 190, 6, C.mut, 'center');
  DIFF_NAMES.forEach((n, i) => {
    const x = W / 2 + (i - 1) * 140, sel = i === diffIdx;
    rect(x - 56, 226, 112, 24, sel ? '#2a2a3a' : '#121218'); g.strokeStyle = sel ? C.cream : '#333'; g.lineWidth = 2; g.strokeRect(x - 56, 226, 112, 24);
    txt(n.toUpperCase(), x, 234, 8, sel ? C.cream : C.mut, 'center');
  });
  controlRow(W / 2 - 200, 258, [{ t: 'Choose', col: C.mut }, { dpad: 'left' }, { dpad: 'right' }, OR, { key: '←' }, { key: '→', gap: 14 },
    { t: 'Start', col: C.mut }, { face: 1 }, OR, { key: 'ENTER' }], C.cream, 1);
  txt('Touch: tap a level, then tap it again to start', W / 2, 278, 6, touchMode ? C.cream : C.mut, 'center');
  drawControls();
}
const diffBox = i => [W / 2 + (i - 1) * 140 - 56, 226, 112, 24];
function drawCard() {
  drawWorld(); drawHUD();
  panel(110, 120);
  txt(`MONTH ${S.month + 1}`, W / 2, 126, 8, C.mut, 'center');
  txt(MONTHS[S.month].name.toUpperCase(), W / 2, 146, 10, C.cream, 'center');
  txt(MONTHS[S.month].note, W / 2, 174, 6, C.ro, 'center');
  if (sceneT > 1.2 && Math.floor(performance.now() / 400) % 2) txt('PRESS A  ·  ENTER  ·  OR TAP', W / 2, 204, 8, C.cream, 'center');
}
function drawSetback() {
  drawWorld(); drawHUD();
  panel(100, 140);
  txt('SETBACK', W / 2, 116, 12, C.red, 'center');
  center(S.setbackWhy, 146, 8, C.cream, 18);
  if (sceneT > 1.5 && Math.floor(performance.now() / 400) % 2) txt(S.hearts > 0 ? 'KEEP GOING: A · ENTER · OR TAP' : 'PRESS A  ·  ENTER  ·  OR TAP', W / 2, 212, 8, C.cream, 'center');
}
function drawEnd() {
  drawSky(); drawCloud(false); drawSun(); drawGround();
  const won = S.month >= 12, st = S.stats, tot = st.lo + st.ro + st.mid || 1;
  txt(won ? 'ONE YEAR TOGETHER' : 'THE YEAR WAS TOO HEAVY', W / 2, 20, 12, won ? C.ro : C.red, 'center');
  txt(won ? 'You kept oscillating.' : `You reached month ${S.month + 1}.`, W / 2, 42, 8, C.mut, 'center');
  panel(58, 222);
  txt(`Time at LOSS-ORIENTED side:         ${Math.round(100 * st.lo / tot)}%`, 84, 74, 6, C.lo);
  txt(`Time at RESTORATION-ORIENTED side:  ${Math.round(100 * st.ro / tot)}%`, 84, 90, 6, C.ro);
  txt(`Time moving in between:             ${Math.round(100 * st.mid / tot)}%`, 84, 106, 6, C.cream);
  txt(`Full swings: ${st.swings}    Collected: ${st.collected}    Setbacks: ${st.setbacks}`, 84, 126, 6, C.cream);
  txt(`Difficulty: ${DIFF_NAMES[diffIdx]}    Mode: ${solo ? 'Solo' : 'Two players'}`, 84, 142, 6, C.mut);
  rect(84, 160, W - 168, 1, '#3a3a48');
  txt('TALK ABOUT IT', 84, 172, 8, C.cream);
  txt('1. Where did you get stuck, and how did you get free?', 84, 192, 6, C.cream);
  txt('2. Did one player carry more of the load?', 84, 208, 6, C.cream);
  txt('3. Where do you see this in Ya-Ting and Zhi-Hong?', 84, 224, 6, C.cream);
  if (sceneT > 2 && Math.floor(performance.now() / 500) % 2) txt('PLAY AGAIN: A · ENTER · OR TAP', W / 2, 252, 8, C.ro, 'center');
}
function drawPaused() {
  panel(120, 100); txt('PAUSED', W / 2, 134, 12, C.cream, 'center');
  controlRow(W / 2 - 150, 162, [{ t: 'Resume' }, { t: 'START', col: C.mut }, OR, { key: 'ESC' }], C.cream, 1);
  controlRow(W / 2 + 10, 162, [{ t: 'Quit' }, { t: 'SELECT', col: C.mut }, OR, { key: 'BKSP' }], C.cream, 1);
  if (touchMode) {
    txt('Touch: tap the game to resume', W / 2, 184, 6, C.cream, 'center');
    g.strokeStyle = C.red; g.lineWidth = 2; g.strokeRect(...QUIT_BOX);
    txt('QUIT TO TITLE', W / 2, QUIT_BOX[1] + 6, 6, C.red, 'center');
  } else txt('Quit returns to the title screen.', W / 2, 194, 6, C.mut, 'center');
}
const QUIT_BOX = [W / 2 - 60, 196, 120, 18];

/* touch button captions follow the mode: solo = LEFT/RIGHT, two players = P1/P2 */
let labelMode = '';
function updateTouchLabels() {
  const m = solo || scene === 'title' || scene === 'join2' ? 'solo' : 'duo';
  if (m === labelMode) return; labelMode = m;
  const set = (id, t) => { document.getElementById(id).textContent = t; };
  if (m === 'solo') { set('lblL', 'LOSS-ORIENTED'); set('lblR', 'RESTORATION'); set('lblLC', 'AT A SIDE'); set('lblRC', 'AT A SIDE'); }
  else { set('lblL', 'P1 · LOSS'); set('lblR', 'P2 · RESTORATION'); set('lblLC', 'P1 MEMORIES'); set('lblRC', 'P2 LIFE TASKS'); }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const inp = gatherInput();
  updateTouchLabels();
  if (visible && !portrait) {
    sceneT += dt;
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; p.t -= dt; });
    particles = particles.filter(p => p.t > 0);

    if (scene === 'title') {
      drawTitle();
      if (inp.any && sceneT > 0.3) { initAudio(); players = []; scene = 'join2'; sceneT = 0; }
    } else if (scene === 'join2') {
      drawJoin2();
      if (sceneT > 0.4) {
        const used = players.filter(Boolean).filter(p => p.kind === 'pad').map(p => p.index);
        const freePad = allPads().find(i => inp.pads[i] && (inp.pads[i].face || inp.pads[i].pump) && !used.includes(i));
        const openSlot = !players[0] ? 0 : !players[1] ? 1 : -1;
        if (freePad !== undefined && openSlot >= 0) { players[openSlot] = { kind: 'pad', index: freePad }; blipLO(); }
        if (!players[0] && anyKey(['a', 's'])) { players[0] = { kind: 'keys' }; blipLO(); }
        if (!players[1] && anyKey(['arrowright', 'arrowdown'])) { players[1] = { kind: 'keys' }; blipRO(); }
        if (!players[0] && (tp('LP') || tp('LC') || inBox(inp.tap, ...SLOT_BOX[0]))) { players[0] = { kind: 'touch' }; blipLO(); }
        if (!players[1] && (tp('RP') || tp('RC') || inBox(inp.tap, ...SLOT_BOX[1]))) { players[1] = { kind: 'touch' }; blipRO(); }
        if (players[0] && players[1]) {
          if (!S || scene === 'join2') { if (sceneT > 0.4 && !window.__readyAt) window.__readyAt = sceneT; }
          if (window.__readyAt && sceneT - window.__readyAt > 1.0) { window.__readyAt = 0; solo = false; scene = 'diff'; sceneT = 0; }
        } else if ((players[0] || players[1]) && (inp.start || kp('enter') || inBox(inp.tap, ...SOLO_BOX))) {
          players = [players[0] || players[1]]; solo = true; scene = 'diff'; sceneT = 0;
        }
      }
    } else if (scene === 'diff') {
      drawDiff();
      if (inp.left) { diffIdx = (diffIdx + 2) % 3; tick(); }
      if (inp.right) { diffIdx = (diffIdx + 1) % 3; tick(); }
      let go = sceneT > 0.3 && inp.confirmBtn;
      if (sceneT > 0.3 && inp.tap) DIFF_NAMES.forEach((n, i) => {
        if (inBox(inp.tap, ...diffBox(i))) { if (i === diffIdx) go = true; else { diffIdx = i; tick(); } }
      });
      if (go) { D = DIFF[DIFF_NAMES[diffIdx]]; newGame(); scene = 'card'; sceneT = 0; }
    } else if (scene === 'card') {
      drawCard();
      if (sceneT > 1.2 && inp.confirm) { scene = 'play'; sceneT = 0; paused = false; startMusic(); }
    } else if (scene === 'play') {
      if (inp.start) { paused = !paused; paused ? stopMusic() : startMusic(); }
      else if (paused && inp.tap) {
        if (inBox(inp.tap, ...QUIT_BOX)) inp.select = true;
        else { paused = false; startMusic(); }
      }
      if (paused && inp.select) { scene = 'title'; paused = false; stopMusic(); }
      if (!paused) update(dt, inp);
      if (scene === 'play' || scene === 'setback' || scene === 'card' || scene === 'end') {
        if (scene === 'play') { drawWorld(); drawHUD(); if (paused) drawPaused(); }
      }
      scheduleMusic();
    } else if (scene === 'setback') {
      drawSetback();
      if (sceneT > 1.5 && inp.confirm) {
        if (S.hearts > 0) { scene = 'play'; sceneT = 0; startMusic(); }
        else { scene = 'end'; sceneT = 0; }
      }
    } else if (scene === 'end') {
      drawEnd();
      if (sceneT > 2 && inp.confirm) { scene = 'diff'; sceneT = 0; }
    }
    if (scene === 'card' || scene === 'setback' || scene === 'end' || scene === 'diff') scheduleMusic();
  } else {
    rect(0, 0, W, H, C.ink);
  }
  keyHit.clear(); tHit.clear(); tap = null;
  requestAnimationFrame(frame);
}
document.fonts && document.fonts.load(`8px ${FONT}`).catch(() => {});
requestAnimationFrame(frame);

/* test hook (used only for automated checks) */
window.__swing = { get scene() { return scene; }, get S() { return S; } };
</script>
</body>
</html>
